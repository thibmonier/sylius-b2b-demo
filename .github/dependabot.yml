# Dependency updates (US-081): Dependabot for every ecosystem of the repository (one tool per ecosystem).
# Weekly, grouped by minor/patch to keep the number of pull requests small; major versions arrive alone.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
