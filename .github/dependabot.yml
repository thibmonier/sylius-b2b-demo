# Dependency updates (US-081): Dependabot for every ecosystem of the repository (one tool per ecosystem).
# Weekly, grouped by minor/patch to keep the number of pull requests small; major versions arrive alone.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]
      # Same decisions as config/demo/version-watch-ignore.json (the weekly version watch).
      ignore:
          # Licence no longer MIT from apexcharts 5: the demo stays on 3.x (US-276).
          - dependency-name: apexcharts
            versions: [">=4"]
          # The demo follows the build chain of Sylius core (@sylius-ui pins Encore 6, stimulus-bridge 3, Babel 7):
          # majors wait for the Sylius migration (US-267, review by 2027-06-30). Minors and patches still come.
          - dependency-name: "@symfony/webpack-encore"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@symfony/stimulus-bridge"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      ignore:
          # Node LTS lines only (even majors once they reach LTS): Node 26 is not LTS yet and its slim image has no yarn.
          - dependency-name: node
            versions: [">=25"]

    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      ignore:
          # MySQL 8.4 LTS (supported until 2032): 9.7 caps foreign key cascades at 30 tables per statement
          # (error 6575) and the Sylius fixture purge exceeds it, so the demo reset fails (PR #60).
          - dependency-name: mysql
            versions: [">=9"]
