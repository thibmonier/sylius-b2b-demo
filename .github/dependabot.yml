# Dependency updates (US-081): Dependabot for every ecosystem of the repository (one tool per ecosystem).
# Weekly, grouped by minor/patch to keep the number of pull requests small; major versions arrive alone.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      ignore:
          # Node LTS lines only (even majors once they reach LTS): Node 26 is not LTS yet and its slim image has no yarn.
          - dependency-name: node
            versions: [">=25"]

    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      ignore:
          # MySQL 8.4 LTS (supported until 2032): 9.7 caps foreign key cascades at 30 tables per statement
          # (error 6575) and the Sylius fixture purge exceeds it, so the demo reset fails (PR #60).
          - dependency-name: mysql
            versions: [">=9"]
