name: CI

on:
    push:
        branches: [main]
    pull_request: ~
    workflow_dispatch: ~

# No default token permission: every job asks for what it needs (US-208).
permissions: {}

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Quality and smoke tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        # A hung test fails the job instead of holding the runner for hours (a deferred trap did it on 2026-10-21).
        timeout-minutes: 30
        env:
            APP_ENV: test
            COVERAGE_MIN_LINES: "90"
            DATABASE_URL: mysql://root@127.0.0.1:3306/sylius_b2b_demo?serverVersion=8.4&charset=utf8mb4
            # Invoice PDFs (invoicing-plugin via KnpSnappy) need wkhtmltopdf; same binary as the image.
            WKHTMLTOPDF_BINARY: /usr/local/bin/wkhtmltopdf
        services:
            mysql:
                image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                ports: ["3306:3306"]
                options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
              with:
                  php-version: "8.5"
                  extensions: intl, gd, zip, exif, pdo_mysql, bcmath
                  tools: composer:2.10.3
                  coverage: pcov

            - name: Composer cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            # --no-scripts: the test cache warmup of debug-less test kernels trips on the Doctrine metadata warmer
            - run: composer install --no-interaction --no-progress --no-scripts

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  cache: yarn

            - run: yarn install --frozen-lockfile && yarn build

            - name: Coding standard and static analysis
              run: |
                  vendor/bin/ecs check src tests
                  vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --memory-limit=1G
                  vendor/bin/rector process --dry-run --no-progress-bar

            # US-168: proof.json must not be behind the repository (test files, plugins). Informative on a pull request
            # (gap and refresh command in the job summary), blocking on main. No network, never writes the proof.
            - name: Published proof is up to date
              continue-on-error: ${{ github.event_name == 'pull_request' }}
              run: php bin/proof-check --summary="$GITHUB_STEP_SUMMARY"

            # wkhtmltox publishes no checksum (recorded at first download); jammy build, no noble build.
            - name: Install wkhtmltopdf (invoice PDFs)
              env:
                  WKHTMLTOX_VERSION: 0.12.6.1-3
                  WKHTMLTOX_SHA256: 4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15
              run: |
                  curl -fsSL -o /tmp/wkhtmltox.deb "https://github.com/wkhtmltopdf/packaging/releases/download/${WKHTMLTOX_VERSION}/wkhtmltox_${WKHTMLTOX_VERSION}.jammy_amd64.deb"
                  echo "${WKHTMLTOX_SHA256}  /tmp/wkhtmltox.deb" | sha256sum -c -
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq /tmp/wkhtmltox.deb
                  wkhtmltopdf --version

            - name: Container and database
              run: |
                  php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
                  php bin/console lint:container
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction
                  php bin/console doctrine:schema:validate --skip-sync
                  php bin/console sylius:fixtures:load demo --no-interaction

            # Line coverage gate: COVERAGE_MIN_LINES sits below the rate of main (92.73 % on 2026-10-23) to absorb noise;
            # raise it with the rate, never lower it to make a build pass.
            # bash -eo pipefail: without it, `phpunit | tee` exits with tee's status and hides failures
            # --colors=never: PHPUnit 13 colours the coverage text, and the summary below greps its rows
            - name: PHPUnit with coverage
              id: coverage
              shell: bash
              run: |
                  mkdir -p build
                  vendor/bin/phpunit --colors=never --coverage-text --coverage-clover build/coverage.xml | tee build/coverage.txt
                  {
                    echo "### Code coverage (blocking below ${COVERAGE_MIN_LINES} % of lines)"
                    echo '```'
                    grep -E '^ *(Classes|Methods|Lines):' build/coverage.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  php bin/check-coverage build/coverage.xml "${COVERAGE_MIN_LINES}" | tee -a "$GITHUB_STEP_SUMMARY"
                  COVERED=$(php -r '$x=simplexml_load_file("build/coverage.xml");echo (int)$x->project->metrics["coveredstatements"];')
                  TOTAL=$(php -r '$x=simplexml_load_file("build/coverage.xml");echo (int)$x->project->metrics["statements"];')
                  if [ "$TOTAL" -gt 0 ]; then
                    RATE=$(php -r "printf('%.2f', 100*$COVERED/$TOTAL);")
                    echo "rate=${RATE}" >> "$GITHUB_OUTPUT"
                    echo "covered=${COVERED}" >> "$GITHUB_OUTPUT"
                    echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish coverage check run
              if: steps.coverage.outputs.rate != ''
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              with:
                  script: |
                      await github.rest.checks.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: 'coverage',
                        head_sha: context.sha,
                        status: 'completed',
                        conclusion: 'success',
                        output: {
                          title: 'Line coverage: ${{ steps.coverage.outputs.rate }}%',
                          summary: 'COVERAGE_LINES: ${{ steps.coverage.outputs.rate }}\n${{ steps.coverage.outputs.covered }}/${{ steps.coverage.outputs.total }} statements covered'
                        }
                      });

    image:
        name: Docker image
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  tags: sylius-b2b-demo:ci
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: The final image does not ship Composer
              run: docker run --rm --entrypoint sh sylius-b2b-demo:ci -c '! command -v composer'

            # The Caddyfile of the image is valid and cuts the body of the public webhook receiver (US-049).
            - name: Caddyfile is valid and limits the webhook receiver body
              run: |
                  docker run --rm --entrypoint frankenphp sylius-b2b-demo:ci validate --config /etc/frankenphp/Caddyfile --adapter caddyfile
                  CHECK_PORT=8099 sh bin/check-caddy-body-limit sylius-b2b-demo:ci

            - name: Start the demo (first start installs the database)
              run: |
                  docker network create demo
                  docker run -d --name mysql --network demo -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=demo \
                    --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=3s --health-retries=40 mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
                  for i in $(seq 1 40); do
                    [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = healthy ] && break
                    sleep 3
                  done
                  [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = healthy ] || { docker logs mysql | tail -30; exit 1; }
                  # Private gate on, as on Railway (US-032): throwaway CI credentials, hash made by the image's PHP.
                  GATE_HASH="$(docker run --rm --entrypoint php sylius-b2b-demo:ci -r 'echo password_hash("ci-gate-password", PASSWORD_ARGON2ID);')"
                  docker run -d --name web --network demo -p 8080:8080 \
                    -e DATABASE_URL="mysql://root@mysql:3306/demo?serverVersion=8.4&charset=utf8mb4" \
                    -e MAILER_DSN="null://null" -e DEFAULT_URI="http://localhost:8080" \
                    -e DEMO_MODE=1 -e DEMO_BASIC_AUTH=1 -e DEMO_BASIC_AUTH_USER=ci \
                    -e TRUSTED_HOSTS='^localhost$' \
                    -e DEMO_BASIC_AUTH_PASSWORD_HASH="$GATE_HASH" \
                    sylius-b2b-demo:ci
                  for i in $(seq 1 100); do
                    curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
                    sleep 3
                  done
                  docker logs web | tail -30
                  curl -fsS -o /dev/null http://localhost:8080/healthz || { echo "The demo did not become healthy" >&2; exit 1; }
                  # The entrypoint starts as root (media volume, US-145) then drops privileges: the long-running processes must not be root.
                  # The image has no ps: read /proc in the container (owner of /proc/<pid> = effective uid of the process).
                  owners() { docker exec web sh -c 'for p in /proc/[0-9]*; do echo "$(stat -c %U "$p") $(cat "$p/comm" 2>/dev/null)"; done'; }
                  for process in frankenphp supercronic; do
                    owners | awk -v p="$process" '$2 == p { print $1 }' | grep -qx www-data \
                      || { echo "$process does not run as www-data" >&2; owners >&2; exit 1; }
                  done

            - name: The private gate refuses visitors without credentials
              run: |
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/fr_FR/)" = 401
                  test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:wrong http://localhost:8080/admin/login)" = 401
                  curl -sI http://localhost:8080/fr_FR/ | grep -qi '^www-authenticate: basic'

            - name: Key pages answer on the right channel
              run: |
                  curl -fsS -o /dev/null -u ci:ci-gate-password http://localhost:8080/admin/login
                  curl -fsS -u ci:ci-gate-password http://localhost:8080/fr_FR/ | grep -q 'Fournitures Pro — B2B'
                  curl -fsS -u ci:ci-gate-password -b demo_channel=B2C http://localhost:8080/fr_FR/ > b2c.html
                  grep -q 'Fournitures Pro — Particuliers' b2c.html
                  grep -q '/withdrawal' b2c.html

    # Supply chain (US-081). Separate jobs on purpose: they are not required checks of main, so a new advisory shows up
    # here without blocking an unrelated merge. Exceptions are dated: security/audit-exceptions.json, .trivyignore.yaml.
    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
              with:
                  php-version: "8.5"
                  tools: composer:2.10.3

            - name: Actions and images are pinned by SHA / digest
              run: bin/check-pinned-refs

            # US-208: review of the diff of composer.lock against the base branch (rewritten tag, new Composer plugin).
            # Offline: it reads the lock of the base branch from git. The table of updates goes to the job summary.
            - name: Review of composer.lock against the base branch
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
                  php bin/check-lock-diff --base="origin/${BASE_REF}" --summary="$GITHUB_STEP_SUMMARY"

            # Abandoned packages are reported, not blocking (behat/transliterator and php-http/message-factory, transitive).
            - name: PHP dependencies (composer audit)
              run: composer audit --locked --abandoned=report

            # The Sylius UI packages are `file:vendor/...` dependencies: yarn audit needs vendor/ to resolve them.
            - name: Install PHP dependencies (vendor/ for the Sylius UI JavaScript packages)
              run: composer install --no-interaction --no-progress --no-scripts

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            - name: JavaScript dependencies (production group, dated exceptions)
              run: bin/audit-js-dependencies

    image-scan:
        name: Image scan and SBOM
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 20
        env:
            TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  tags: sylius-b2b-demo:scan
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Report first (all severities, never failing), then the gate: a fixable CRITICAL vulnerability that has no
            # dated exception in .trivyignore.yaml fails the job.
            - name: Scan report
              run: |
                  mkdir -p reports
                  docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
                    image --ignorefile .trivyignore.yaml --format table --output reports/image-scan.txt sylius-b2b-demo:scan
                  tail -n 40 reports/image-scan.txt

            - name: Scan gate (CRITICAL, fixable)
              run: |
                  docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
                    image --ignorefile .trivyignore.yaml --severity CRITICAL --ignore-unfixed --exit-code 1 sylius-b2b-demo:scan

            - name: SBOM (CycloneDX)
              run: |
                  docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
                    image --format cyclonedx --output reports/sbom.cdx.json sylius-b2b-demo:scan

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: image-scan-and-sbom
                  path: reports/

    # US-208: static audit of the workflows themselves. Version and image are pinned (tag and digest), no network.
    zizmor:
        name: Workflow audit (zizmor)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        env:
            ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: zizmor (offline)
              run: docker run --rm -v "$PWD:/work" -w /work "$ZIZMOR_IMAGE" --offline .github
