name: CI

on:
    push:
        branches: [main]
    pull_request: ~
    workflow_dispatch: ~

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Quality and smoke tests
        runs-on: ubuntu-latest
        env:
            APP_ENV: test
            DATABASE_URL: mysql://root@127.0.0.1:3306/sylius_b2b_demo?serverVersion=8.4&charset=utf8mb4
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                ports: ["3306:3306"]
                options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: intl, gd, zip, exif, pdo_mysql, bcmath
                  tools: composer:v2
                  coverage: none

            - name: Composer cache
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            # --no-scripts: the test cache warmup of debug-less test kernels trips on the Doctrine metadata warmer
            - run: composer install --no-interaction --no-progress --no-scripts

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: yarn

            - run: yarn install --frozen-lockfile && yarn build

            - name: Coding standard and static analysis
              run: |
                  vendor/bin/ecs check src tests
                  vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --memory-limit=1G

            - name: Container and database
              run: |
                  php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
                  php bin/console lint:container
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction
                  php bin/console sylius:fixtures:load demo --no-interaction

            - run: vendor/bin/phpunit

    image:
        name: Docker image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  tags: sylius-b2b-demo:ci
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Start the demo (first start installs the database)
              run: |
                  docker network create demo
                  docker run -d --name mysql --network demo -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=demo \
                    --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=3s --health-retries=40 mysql:8.4
                  for i in $(seq 1 40); do
                    [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = healthy ] && break
                    sleep 3
                  done
                  [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = healthy ] || { docker logs mysql | tail -30; exit 1; }
                  docker run -d --name web --network demo -p 8080:8080 \
                    -e DATABASE_URL="mysql://root@mysql:3306/demo?serverVersion=8.4&charset=utf8mb4" \
                    -e MAILER_DSN="null://null" -e DEFAULT_URI="http://localhost:8080" \
                    -e DEMO_MODE=1 \
                    sylius-b2b-demo:ci
                  for i in $(seq 1 100); do
                    curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
                    sleep 3
                  done
                  docker logs web | tail -30
                  curl -fsS -o /dev/null http://localhost:8080/healthz || { echo "The demo did not become healthy" >&2; exit 1; }

            - name: Key pages answer on the right channel
              run: |
                  curl -fsS -o /dev/null http://localhost:8080/admin/login
                  curl -fsS http://localhost:8080/fr_FR/ | grep -q 'Fournitures Pro — B2B'
                  curl -fsS -b demo_channel=B2C http://localhost:8080/fr_FR/ > b2c.html
                  grep -q 'Fournitures Pro — Particuliers' b2c.html
                  grep -q '/withdrawal' b2c.html
