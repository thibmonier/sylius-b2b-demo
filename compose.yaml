# Local environment (US-003). Production runs the same image on Railway (ADR-0002).
services:
    web:
        build:
            context: .
            dockerfile: docker/Dockerfile
        environment:
            APP_ENV: prod
            APP_DEBUG: "0"
            DATABASE_URL: mysql://root@mysql:3306/sylius_b2b_demo?serverVersion=9.7&charset=utf8mb4
            MAILER_DSN: smtp://mailpit:1025
            DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
            DEMO_MODE: "1"
            # Local run: no private gate (it stays on by default, for Railway).
            DEMO_BASIC_AUTH: "0"
            # No gate means the public-mode rules of app:demo:preflight (US-050): registrations closed, unless the run keeps the gate.
            DEMO_REGISTRATION_OPEN: "${DEMO_REGISTRATION_OPEN:-0}"
            # Only the local host name (the preflight refuses the open default "^.*$").
            TRUSTED_HOSTS: "^localhost$"
            DEMO_MAILPIT_URL: "http://localhost:8025"
            DEMO_MAILPIT_API_URL: "http://mailpit:8025"
            # FrankenPHP (ADR-0013): bounded threads; worker mode is opt-in (FRANKENPHP_WORKER_MODE=1), off by default.
            FRANKENPHP_NUM_THREADS: ${FRANKENPHP_NUM_THREADS:-8}
            FRANKENPHP_MAX_THREADS: ${FRANKENPHP_MAX_THREADS:-16}
            FRANKENPHP_WORKER_MODE: ${FRANKENPHP_WORKER_MODE:-0}
            FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-4}
        ports:
            - "${WEB_PORT:-8080}:8080"
        depends_on:
            mysql:
                condition: service_healthy
            mailpit:
                condition: service_started

    mysql:
        image: mysql:9.7.1@sha256:cbade841779f1661300e705721f9d2ff159865cc7a8a291affbff43ac6ec7f1d
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # local only, never published
            MYSQL_DATABASE: sylius_b2b_demo
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            retries: 20
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            # Bind to loopback only: passwordless MySQL must not be reachable from the LAN.
            - "127.0.0.1:${MYSQL_PORT:-3340}:3306"

    mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports:
            - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
            - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"

volumes:
    mysql-data:
