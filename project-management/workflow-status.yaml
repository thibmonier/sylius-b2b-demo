# Workflow claude-craft — démo B2B Sylius
project: sylius-b2b-demo
track: enterprise            # forcé (/workflow:init --enterprise), score de complexité 17/18
initialized_at: 2026-10-15T00:00:00+02:00
current_phase: design

scope:
  goal: "Démo B2B Sylius 2.3 publique (non promue sur les canaux Sylius) réunissant les 21 plugins tmonier"
  deliverables:
    - "Application Sylius 2.3 avec les 21 plugins tmonier (+ plugins communautaires si nécessaires)"
    - "Thème dérivé du thème officiel, orienté B2B : mire de login obligatoire configurable, présentation produits B2B"
    - "Badges/icônes signalant la fonctionnalité de chaque plugin (à la manière de la démo Sylius Plus)"
    - "Jeu de données B2B (catalogue, entreprises, membres, crédits, paliers de prix…)"
    - "Plugins manquants créés si l'environnement n'est pas cohérent"
    - "Environnement Docker (dev et prod)"
    - "Déploiement Railway (plan Hobby) avec remise à zéro des données chaque nuit"
  decisions:
    sylius_plus: "Démo publique, non promue sur Slack/canaux Sylius (politique du 2026-10-14) ; tous les plugins inclus"
    location: "sylius_plugins/sylius-b2b-demo, futur dépôt GitHub thibmonier/sylius-b2b-demo"
    # Porte d'analyse validée le 2026-10-15
    budget: "Railway jusqu'à 25 $/mois, démo toujours allumée, Mailpit inclus, limite d'usage posée"
    new_plugins: "accès B2B / catalogue fermé, référence de commande (PO), listes d'achat partagées (spike wishlist officielle d'abord), adresses d'entreprise (évolution company-accounts)"
    b2c_channel: "petit canal B2C secondaire (withdrawal, GPSR, agentic-feeds)"
    languages: "français + anglais"
    docker_image: "FrankenPHP (Caddy) — demandé par l'utilisateur"

complexity:
  files: enterprise          # 50+ (application, thème, fixtures, Docker, CI/CD)
  entities: enterprise       # données B2B multi-plugins, éventuels nouveaux plugins
  integrations: enterprise   # 21 plugins, plugins communautaires, Railway, cron
  stories: enterprise        # 15+
  teams: standard
  security: enterprise       # démo publique, comptes de démo, secrets Railway, reset nocturne

phases:
  analysis:
    status: done                     # porte validée le 2026-10-15
    artifacts:
      research_summary: done         # analysis/research-summary.md (+ raw/A,B,C,D)
      constraints: done
      risks_opportunities: done
      technical_options: done
    findings:
      composer_resolution: "OK — Sylius 2.3.1 + 21 plugins + invoicing 2.3 + mcp-server 0.2 + ai-bundle 0.14 (Symfony 7.4 et 8.0)"
      agentic_feeds_not_on_packagist: true
      punchout_readme_env_mismatch: true
  planning:
    status: done                     # porte validée le 2026-10-15
    artifacts: {prd: done, personas: done, backlog: done}   # 9 epics, 37 stories, 156 points, 6 sprints
    answers: {Q1: "domaine Railway par défaut", Q2: "nouveaux plugins open source MIT sur Packagist", Q3: "PunchOut en fenêtre, pas d'iframe (pas de SameSite=None)"}
  design:
    status: done                     # en attente de validation utilisateur (porte de conception)
    artifacts: {tech_spec: done, architecture: done, adr: done}   # tech-spec.md, architecture/{c4-*,erd,api,security}.md, docs/adr/0001-0010
    gate_checklist:
      prd_covered: true              # tech-spec §12 (FR-1..27, NFR-1..8)
      nfr_supported: true
      data_model: true               # 7 nouvelles tables (plugins) + 1 table démo
      api: true
      security: true                 # architecture/security.md (OWASP 2025, modèle de menace)
      test_strategy: true            # tech-spec §11
      deployment: true               # tech-spec §10, ADR-0002/0003
    design_findings:
      - "Sylius-Standard 2.3 embarque Stripe/Adyen/Mollie/PayPal (retirés) et refund-plugin (conservé si compatible)"
      - "invoicing et refund exigent knp-snappy : wkhtmltox 0.12.6.1 (patched qt) dans l'image bookworm"
