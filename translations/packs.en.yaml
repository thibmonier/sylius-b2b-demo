title: "Install a pack"
intro: "A pack groups several plugins of this demo into one Composer package. This page lists each pack, its plugins, its install command and the steps that are still left to do by hand. It is generated from the composer.json and the READMEs of each pack repository, never written by hand."
what:
    title: "What a pack is"
    does: "A pack is a Composer metapackage: it contains no code and requires plugins with version bounds chosen to resolve together. One composer require command installs them."
    does_not: "A metapackage alone does not register the bundles, import the configuration or the routes, run the migrations or schedule the tasks: those steps stay manual, plugin by plugin, as the table of each pack lists them."
pack:
    install: "Install command"
    plugins: "Plugins in the pack"
    suggests: "Suggested, not installed by the pack"
    steps: "Steps left after the command"
    steps_intro: "For each plugin, in this order. The detailed steps, with their options, are in the README of each plugin."
steps:
    caption: "Steps left to do by hand for each plugin of the %pack% pack"
    column:
        plugin: "Plugin"
