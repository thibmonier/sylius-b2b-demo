title: 'Sylius Plus, l’offre officielle'
text: 'Sylius Plus est l’édition commerciale de Sylius, construite sur l’édition communautaire. Ses fonctions B2B (la page officielle présente une « B2B Suite ») peuvent compléter les plugins présentés ici ; leur compatibilité est à vérifier selon votre projet.'
link: 'Découvrir Sylius Plus sur le site officiel de Sylius'
