title: "Guide d'intégration des plugins"
intro: "Guide technique en libre-service pour les développeurs et les intégrateurs : prérequis, installation type d'un plugin, architecture type, questions à régler avant de commencer et dépôts GitHub. Chaque plugin a son propre README, qui fait foi."
prerequisites:
    title: "Prérequis"
    sylius: "Sylius 2.3 (2.2.9 minimum pour la plupart des plugins : les versions 2.2 antérieures sont touchées par des avis de sécurité sur le panier et le paiement)."
    php: "PHP 8.2 ou plus (8.3 ou plus avec Sylius 2.3) ; la démo requiert PHP 8.4 ou plus."
    symfony: "Symfony 6.4, 7.4 ou 8.0 selon le plugin ; la démo tourne sous Symfony 8.1."
    composer: "Composer, une base de données gérée par Doctrine, et Node avec yarn pour recompiler les assets de l'administration."
install:
    title: "Installation type d'un plugin"
    intro: "Exemple avec le plugin de commande rapide. Les autres suivent le même schéma ; les noms de bundle, de ressources et de tables changent, et le README du plugin donne la liste exacte."
    override_link: "Adapter un plugin sans le modifier : le guide de surcharge, avec des exemples réels de la démo."
    require:
        title: "Installer le paquet"
    bundle:
        title: "Enregistrer le bundle dans config/bundles.php"
    config:
        title: "Importer la configuration dans config/packages/tmonier_sylius_quick_order.yaml"
    routes:
        title: "Importer les routes dans config/routes/tmonier_sylius_quick_order.yaml"
    migrations:
        title: "Exécuter les migrations"
        text: "Le plugin de commande rapide n'a pas de table et n'a donc pas de migration. La plupart des autres plugins en ont (PunchOut, demandes de prix) : jouez la commande, après l'avoir relue."
    assets:
        title: "Installer les assets, puis vider le cache"
        text: "Nécessaire pour les plugins qui livrent du CSS ou du JavaScript côté administration ou boutique (palette de commandes, par exemple). Recompilez ensuite les assets de l'application (yarn install && yarn build)."
questions:
    title: "Questions à régler avant de commencer"
    erp:
        summary: "Quel ERP, et quelles données doivent circuler ?"
        text: "Les prix, les stocks, les clients et les commandes doivent-ils s'échanger dans un sens ou dans les deux, et à quelle fréquence ? La réponse fixe l'architecture et une grande part du travail d'intégration."
    punchout:
        summary: "Les acheteurs commandent-ils depuis leur système d'achat ?"
        text: "PunchOut cXML ou OCI : quelles plateformes, quels acheteurs, quelles informations reprendre dans la commande ? Un compte de test chez l'acheteur facilite la recette."
    e-invoicing:
        summary: "Quelles sont les obligations de facturation électronique ?"
        text: "Quel format de facture (Factur-X, par exemple), quelle plateforme de transmission, quelle échéance pour la société ? La démo produit des factures Factur-X ; le choix de la plateforme de transmission reste à faire."
    volume:
        summary: "Quelle est la volumétrie ?"
        text: "Nombre de références, de sociétés clientes et d'utilisateurs, commandes par jour, import du catalogue : ces chiffres dimensionnent l'hébergement et les tests de charge."
architecture:
    title: "Architecture type"
    intro: "Les plugins s'ajoutent à la boutique Sylius. Les échanges avec l'extérieur passent par des interfaces standard."
    figure_title: "Schéma d'architecture type"
    figure_desc: "La boutique Sylius 2 avec ses plugins B2B reçoit les paniers des plateformes d'achat des acheteurs (PunchOut cXML ou OCI) et les demandes des assistants IA (MCP). Elle échange les catalogues, les prix, les stocks et les commandes avec l'ERP, et produit les factures Factur-X pour la facturation électronique."
    shop: "Boutique Sylius 2 + plugins B2B"
    punchout: "Plateformes d'achat (PunchOut)"
    mcp: "Assistants IA (MCP)"
    erp: "ERP"
    invoicing: "Facturation électronique"
    caption: "Entrées : PunchOut cXML ou OCI et assistants IA (MCP). Échanges avec l'ERP : catalogue, prix, stocks, commandes. Sortie : factures Factur-X."
    demo_link: "La démo elle-même est décrite sur une page dédiée : Architecture de la démo."
integrations:
    title: "Intégrations et état"
    intro: "Ce que la boutique sait connecter à l'extérieur et où en est chaque intégration. Une intégration « non fournie » n'a pas de plugin : la page le dit et renvoie vers le contrat d'événements sur lequel un développeur peut s'appuyer."
    plugin: "Plugin :"
    not_provided_note: "Aucun plugin ne la couvre."
    contract: "Contrat d'événements : %plugin%"
    state:
        available: "Disponible"
        in_progress: "En cours"
        upcoming: "À venir"
        not_provided: "Non fourni"
    items:
        erp:
            name: "ERP"
            text: "Prix, stocks, clients et commandes échangés avec le système de gestion de l'entreprise."
        pim:
            name: "PIM"
            text: "Fiches produit enrichies dans un outil externe et reprises dans le catalogue."
        carriers:
            name: "Transporteurs"
            text: "Données logistiques par variante et règles de remplissage par conteneur, base d'un calcul de transport."
        einvoicing_format:
            name: "Facture électronique, format"
            text: "Factures Factur-X : PDF lisible et données structurées embarquées."
        einvoicing_platform:
            name: "Facture électronique, plateforme de transmission"
            text: "Dépôt des factures auprès d'une plateforme agréée (PA ou PDP)."
        purchasing_portals:
            name: "Portails d'achat"
            text: "Ouverture de la boutique depuis le système d'achat de l'acheteur, retour du panier en cXML ou OCI."
        large_accounts:
            name: "Grands comptes"
            text: "Sociétés clientes, utilisateurs, rôles, adresses et plafonds."
        ai_assistants:
            name: "Assistants IA"
            text: "Outils B2B exposés par le serveur MCP : lister les commandes, commander par référence."
        equipment_fleet:
            name: "Parc d'équipements du client"
            text: "Pièces détachées compatibles avec les machines déclarées par le client."
repositories:
    title: "Dépôts et README"
    intro: "Chaque plugin est un dépôt GitHub indépendant, avec son README (installation, configuration, tests) et son paquet Composer."
    github: "Dépôt GitHub"
    readme: "README"
