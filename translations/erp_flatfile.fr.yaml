title: "Échange par fichier plat"
intro: "Le plugin d'export en fichier plat écrit les commandes passées dans un fichier CSV, selon un contrat documenté, déposé dans un répertoire d'échange qu'un système de gestion peut lire. Cette page montre le contrat et un extrait de fichier produit à partir des dernières commandes de la démonstration."
neutral: "Le contrat est neutre : le plugin ne se connecte à aucun logiciel de gestion et n'en nomme aucun. L'extrait ci-dessous est produit par le plugin lui-même, avec des adresses masquées."
contract:
    title: "Le contrat du fichier"
    intro: "Une ligne d'en-tête, puis une ligne par ligne de commande."
    encoding: "Encodage UTF-8, sans marque d'ordre des octets."
    separator: "Séparateur point-virgule ; un champ qui contient un point-virgule est entouré de guillemets."
    lines: "Une ligne par ligne de commande, chacune terminée par un saut de ligne."
    amounts: "Montants en entiers dans l'unité mineure de la devise, sans point décimal."
    name: "Un fichier par lot, au nom unique : commandes, date et heure UTC, puis huit caractères."
columns:
    order_number: "Numéro de la commande."
    webhook_id: "Identifiant de l'événement de l'outbox : la clé d'idempotence côté lecteur."
    placed_at: "Date de fin du tunnel de commande, en UTC."
    currency: "Code de la devise de la commande."
    customer_email: "Adresse du client (masquée dans cet extrait)."
    variant_code: "Code de la variante de produit."
    quantity: "Quantité commandée."
    unit_price_minor: "Prix unitaire, en unité mineure."
    line_total_minor: "Total de la ligne, en unité mineure."
    ship_country: "Code pays de l'adresse de livraison."
sample:
    title: "Un extrait de fichier"
    intro: "Produit à partir des trois dernières commandes passées de la démonstration (deux commandes fictives si la démonstration n'en contient aucune)."
run:
    title: "L'exécution"
    intro: "Une commande console écrit un lot ; planifiez-la au rythme où le lecteur relit le répertoire."
    atomic: "Le fichier est écrit sous un nom provisoire puis renommé : un lecteur ne voit jamais de fichier partiel."
    once: "Chaque événement est exporté une seule fois ; la livraison est au moins une fois, le lecteur déduplique sur l'identifiant d'événement."
    unavailable: "Si le répertoire est absent, non inscriptible ou plein, aucun fichier ne reste, l'erreur est consignée et les événements restent à exporter."
    retention: "Le plugin ne purge pas le répertoire : la durée de conservation des fichiers, qui contiennent des adresses, se fixe côté exploitant."
integrate_link: "Retour au guide d'intégration"
