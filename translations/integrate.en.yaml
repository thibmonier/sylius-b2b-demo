title: "Plugin integration guide"
intro: "A self-service technical guide for developers and integrators: prerequisites, typical plugin installation, typical architecture, questions to settle before starting and GitHub repositories. Each plugin has its own README, which is authoritative."
cta:
    title: "A question?"
    text: "A question about a plugin or about this guide?"
prerequisites:
    title: "Prerequisites"
    sylius: "Sylius 2.3 (2.2.9 at least for most plugins: earlier 2.2 versions are affected by cart and payment security advisories)."
    php: "PHP 8.2 or later (8.3 or later with Sylius 2.3); the demo requires PHP 8.4 or later."
    symfony: "Symfony 6.4, 7.4 or 8.0 depending on the plugin; the demo runs on Symfony 8.1."
    composer: "Composer, a database managed by Doctrine, and Node with yarn to rebuild the admin assets."
install:
    title: "Typical plugin installation"
    intro: "Example with the quick order plugin. The others follow the same pattern; bundle, resource and table names change, and the plugin README gives the exact list."
    require:
        title: "Require the package"
    bundle:
        title: "Register the bundle in config/bundles.php"
    config:
        title: "Import the configuration in config/packages/tmonier_sylius_quick_order.yaml"
    routes:
        title: "Import the routes in config/routes/tmonier_sylius_quick_order.yaml"
    migrations:
        title: "Run the migrations"
        text: "The quick order plugin has no table, hence no migration. Most of the other plugins have some (PunchOut, quote requests): run the command after reading it through."
    assets:
        title: "Install the assets, then clear the cache"
        text: "Needed for the plugins that ship CSS or JavaScript to the admin panel or the shop (the command palette, for example). Then rebuild the application assets (yarn install && yarn build)."
questions:
    title: "Questions to settle before starting"
    erp:
        summary: "Which ERP, and which data must flow?"
        text: "Must prices, stock, customers and orders be exchanged one way or both ways, and how often? The answer sets the architecture and a large part of the integration work."
    punchout:
        summary: "Do buyers order from their procurement system?"
        text: "PunchOut cXML or OCI: which platforms, which buyers, which information to carry into the order? A test account at the buyer makes acceptance testing easier."
    e-invoicing:
        summary: "What are the e-invoicing obligations?"
        text: "Which invoice format (Factur-X, for example), which transmission platform, which deadline for the company? The demo produces Factur-X invoices; the choice of the transmission platform is still to be made."
    volume:
        summary: "What is the volume?"
        text: "Number of references, customer companies and users, orders per day, catalogue import: these figures size the hosting and the load tests."
architecture:
    title: "Typical architecture"
    intro: "The plugins are added to the Sylius shop. Exchanges with the outside go through standard interfaces."
    figure_title: "Typical architecture diagram"
    figure_desc: "The Sylius 2 shop with its B2B plugins receives the carts of the buyers' procurement platforms (PunchOut cXML or OCI) and the requests of AI assistants (MCP). It exchanges catalogues, prices, stock and orders with the ERP, and produces Factur-X invoices for e-invoicing."
    shop: "Sylius 2 shop + B2B plugins"
    punchout: "Procurement platforms (PunchOut)"
    mcp: "AI assistants (MCP)"
    erp: "ERP"
    invoicing: "E-invoicing"
    caption: "Inputs: PunchOut cXML or OCI and AI assistants (MCP). ERP exchanges: catalogue, prices, stock, orders. Output: Factur-X invoices."
repositories:
    title: "Repositories and READMEs"
    intro: "Each plugin is an independent GitHub repository, with its README (installation, configuration, tests) and its Composer package."
    github: "GitHub repository"
    readme: "README"
