order:
    id_label: "Numéro de commande d'achat (orderID)"
    send: "Envoyer l'OrderRequest"
sent:
    title: "OrderRequest accepté : la commande est créée côté boutique."
    po: "Référence de commande d'achat : %po%"
error:
    csrf: "Formulaire expiré, veuillez réessayer."
    buyer_missing: "L'acheteur de démonstration n'est pas chargé dans la boutique."
    endpoint_status: "L'endpoint PunchOut de la boutique a répondu par une erreur."
    endpoint_unreachable: "L'endpoint PunchOut de la boutique est injoignable."
    invalid_response: "La réponse de la boutique n'est pas un document cXML valide."
    invalid_message: "Le message de retour n'est pas un PunchOutOrderMessage valide. Aucune commande n'a été créée."
    already_sent: "Cette commande a déjà été envoyée : une session du simulateur ne peut créer qu'une seule commande. Relancez une session."
    daily_cap: "Le plafond quotidien de commandes du simulateur est atteint sur cette démo publique. Aucune commande n'a été créée ; réessayez demain."
    forged_return: "Ce panier ne provient pas de la boutique : le retour est refusé. Aucune commande n'a été créée."
    return_replayed: "Ce panier a déjà été reçu : un retour ne peut être utilisé qu'une fois. Relancez une session ; aucune commande n'a été créée."
    hook_url_not_allowed: "Cette HOOK_URL est refusée : elle doit être en HTTPS et appartenir aux domaines de retour de l'acheteur : %domains%. Aucun appel n'a été émis vers la boutique."
    invalid_oci_return: "Les champs NEW_ITEM-* reçus sont invalides. Rien n'est affiché."
    session_expired: "Cette session du simulateur est expirée ou invalide. Relancez une session ; aucune commande n'a été créée."
    empty_cart: "Le panier renvoyé est vide : il n'y a rien à commander."
    empty_cart_order: "Le panier est vide : l'envoi de l'OrderRequest est refusé."
    invalid_order_id: "Le numéro de commande d'achat doit comporter 1 à 64 lettres, chiffres ou tirets."
    status_400: "La boutique a refusé la demande (400)."
    status_401: "Secret partagé ou identité refusés par la boutique (401)."
    status_403: "Domaine de retour refusé (403) : l'hôte %host% doit figurer dans les domaines de retour de l'acheteur (%domains%)."
    status_429: "Trop de requêtes, réessayez dans une minute (429)."
    status_other: "La boutique a refusé la demande."
plugins_link: "Essayer le simulateur d'outil d'achat PunchOut"
portal:
    name: "Portail d'achat d'Acme Industries"
    note: "Portail fictif, sans marque réelle : il joue le rôle de l'outil d'achat de l'acheteur."
steps:
    title: "Les quatre étapes"
    done: "terminée"
    s1:
        title: "Lancer la session"
        text: "Le portail demande à la boutique d'ouvrir une session pour l'acheteur."
    s2:
        title: "Parcourir la boutique"
        text: "Vous arrivez dans la boutique, connecté comme l'acheteur, et vous remplissez un panier."
    s3:
        title: "Recevoir le panier"
        text: "Le panier revient dans le portail, ligne par ligne, avec le total."
    s4:
        title: "Passer la commande"
        text: "Le portail envoie la commande d'achat à la boutique, qui crée la commande."
        text_oci: "Un retour OCI ne crée pas de commande : le panier reçu est seulement affiché."
vocabulary:
    title: "Vocabulaire :"
    cxml:
        label: "cXML"
        definition: "Format d'échange de documents d'achat (demande de session, panier, commande) entre un portail d'achat et une boutique."
    oci:
        label: "OCI"
        definition: "Autre protocole d'achat : la boutique renvoie le panier sous forme de champs de formulaire NEW_ITEM-*."
    order_request:
        label: "OrderRequest"
        definition: "Le message cXML par lequel le portail envoie la commande d'achat à la boutique."
    hook_url:
        label: "HOOK_URL"
        definition: "L'adresse du portail à laquelle la boutique renvoie le panier ; elle doit appartenir aux domaines autorisés de l'acheteur."
flow:
    title: "Flux d'une session PunchOut"
    desc: "Quatre étapes en séquence : le portail lance la session, la boutique est parcourue par l'acheteur, le panier revient au portail, puis le portail envoie la commande à la boutique."
    s1: "Portail : lancer"
    s2: "Boutique : choisir"
    s3: "Portail : panier reçu"
    s4: "Boutique : commande"
restart: "Relancer une session"
