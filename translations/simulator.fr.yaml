title: "Simulateur d'outil d'achat"
switch_language: English
intro: "Cette page joue le rôle de l'outil d'achat (Ariba, SAP…) d'Acme Industries : elle envoie une demande PunchOut cXML à la boutique, vous y arrivez connecté comme l'acheteur, puis le panier transféré s'affiche ici et peut être commandé (OrderRequest)."
start: "Lancer une session PunchOut (cXML)"
protocol:
    label: "Protocole PunchOut"
    cxml: "cXML (Ariba, Coupa)"
    oci: "SAP OCI"
oci:
    intro: "Cette page joue le rôle d'un acheteur SAP : elle ouvre le catalogue de la boutique par un appel OCI (USERNAME, PASSWORD, HOOK_URL), vous y arrivez connecté comme l'acheteur, puis le panier transféré revient ici sous forme de champs NEW_ITEM-*. Le retour OCI ne crée aucune commande."
    hook_url: "HOOK_URL (retour du panier)"
    hook_url_help: "Pré-remplie avec le retour de ce simulateur. Elle doit appartenir aux domaines de retour autorisés de l'acheteur, en HTTPS : toute autre adresse est refusée avant tout appel à la boutique."
    wrong_password: "Envoyer un mot de passe erroné"
    start: "Ouvrir le catalogue (SAP OCI)"
    received: "Panier reçu : champs NEW_ITEM-* lus. Aucune commande n'est créée par un retour OCI."
buyer:
    info: "Acheteur simulé : Acme Industries (identifiants fictifs). Le secret partagé reste côté serveur. Domaines de retour autorisés pour cet acheteur : %domains%."
errors:
    legend: "Simuler une erreur"
    wrong_secret: "Envoyer un secret partagé erroné"
    foreign_domain: "Utiliser un domaine de retour non autorisé"
cart:
    title: "Panier reçu de la boutique"
    part: Référence
    description: Désignation
    quantity: Quantité
    unit_price: "Prix unitaire HT"
    total: "Total HT"
    empty: "Le panier reçu est vide (l'acheteur a annulé ou n'a rien ajouté)."
order:
    id_label: "Numéro de commande d'achat (orderID)"
    send: "Envoyer l'OrderRequest"
sent:
    title: "OrderRequest accepté : la commande est créée côté boutique."
    po: "Référence de commande d'achat : %po%"
error:
    csrf: "Formulaire expiré, veuillez réessayer."
    buyer_missing: "L'acheteur de démonstration n'est pas chargé dans la boutique."
    endpoint_status: "L'endpoint PunchOut de la boutique a répondu par une erreur."
    endpoint_unreachable: "L'endpoint PunchOut de la boutique est injoignable."
    invalid_response: "La réponse de la boutique n'est pas un document cXML valide."
    invalid_message: "Le message de retour n'est pas un PunchOutOrderMessage valide. Aucune commande n'a été créée."
    already_sent: "Cette commande a déjà été envoyée : une session du simulateur ne peut créer qu'une seule commande. Relancez une session."
    daily_cap: "Le plafond quotidien de commandes du simulateur est atteint sur cette démo publique. Aucune commande n'a été créée ; réessayez demain."
    forged_return: "Ce panier ne provient pas de la boutique : le retour est refusé. Aucune commande n'a été créée."
    return_replayed: "Ce panier a déjà été reçu : un retour ne peut être utilisé qu'une fois. Relancez une session ; aucune commande n'a été créée."
    hook_url_not_allowed: "Cette HOOK_URL est refusée : elle doit être en HTTPS et appartenir aux domaines de retour de l'acheteur. Aucun appel n'a été émis vers la boutique."
    invalid_oci_return: "Les champs NEW_ITEM-* reçus sont invalides. Rien n'est affiché."
    session_expired: "Cette session du simulateur est expirée ou invalide. Relancez une session ; aucune commande n'a été créée."
    empty_cart: "Le panier renvoyé est vide : il n'y a rien à commander."
    empty_cart_order: "Le panier est vide : l'envoi de l'OrderRequest est refusé."
    invalid_order_id: "Le numéro de commande d'achat doit comporter 1 à 64 lettres, chiffres ou tirets."
    status_400: "La boutique a refusé la demande (400)."
    status_401: "Secret partagé ou identité refusés par la boutique (401)."
    status_403: "Domaine de retour refusé (403) : l'hôte %host% doit figurer dans les domaines de retour de l'acheteur."
    status_429: "Trop de requêtes, réessayez dans une minute (429)."
    status_other: "La boutique a refusé la demande."
