title: "Simulateur d'outil d'achat"
switch_language: English
intro: "Cette page joue le rôle de l'outil d'achat (Ariba, SAP…) d'Acme Industries : elle envoie une demande PunchOut cXML à la boutique, vous y arrivez connecté comme l'acheteur, puis le panier transféré s'affiche ici et peut être commandé (OrderRequest)."
