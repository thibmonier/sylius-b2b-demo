title: "Flat-file exchange"
intro: "The flat-file export plugin writes the placed orders to a CSV file, according to a documented contract, in an exchange directory that a business system can read. This page shows the contract and an excerpt of a file produced from the latest orders of the demonstration."
neutral: "The contract is neutral: the plugin connects to no business software and names none. The excerpt below is produced by the plugin itself, with masked addresses."
contract:
    title: "The contract of the file"
    intro: "A header line, then one line per order line."
    encoding: "UTF-8 encoding, without a byte order mark."
    separator: "Semicolon separator; a field that contains a semicolon is enclosed in quotes."
    lines: "One line per order line, each ending with a line break."
    amounts: "Amounts as integers in the minor unit of the currency, with no decimal point."
    name: "One file per batch, with a unique name: orders, UTC date and time, then eight characters."
columns:
    order_number: "Number of the order."
    webhook_id: "Id of the outbox event: the idempotence key on the reader side."
    placed_at: "Date of the end of the checkout, in UTC."
    currency: "Currency code of the order."
    customer_email: "Address of the customer (masked in this excerpt)."
    variant_code: "Code of the product variant."
    quantity: "Quantity ordered."
    unit_price_minor: "Unit price, in the minor unit."
    line_total_minor: "Total of the line, in the minor unit."
    ship_country: "Country code of the shipping address."
sample:
    title: "An excerpt of a file"
    intro: "The first lines of the last file really produced by the plugin from the orders of the demonstration, for the channel shown (addresses masked)."
    status:
        no_file: "No file has been produced yet: the excerpt appears with the first export."
        empty: "The last file is empty: there is nothing to show for now."
        other_channel: "The last file holds no order of this channel. Switch channel to see its lines."
        unavailable: "The excerpt is not available at the moment."
run:
    title: "Running it"
    intro: "A console command writes one batch; schedule it at the rhythm the reader reads the directory."
    atomic: "The file is written under a provisional name then renamed: a reader never sees a partial file."
    once: "Each event is exported once; delivery is at least once, the reader deduplicates on the event id."
    unavailable: "If the directory is missing, not writable or full, no file is left behind, the error is logged and the events stay to export."
    retention: "The plugin does not purge the directory: the retention of the files, which hold addresses, is set by the operator."
doc_link: "The whole journey, with the Demo ERP (fictitious) that sends back a simulated acknowledgement: the documentation"
integrate_link: "Back to the integration guide"
