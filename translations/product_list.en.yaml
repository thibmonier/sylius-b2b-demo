# US-198: texts of the B2B product list (domain `product_list`). Figures come from the data (counts, limits), never from the text.
header:
    count: '%count% product.|%count% products.'
    prices_note: 'The prices shown are those of your company, excluding VAT.'
categories:
    title: 'Categories'
notice:
