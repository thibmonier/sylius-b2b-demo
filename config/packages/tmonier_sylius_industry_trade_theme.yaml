# Configuration du thème Industrie & Négoce
# Ce fichier est copié par la recette Flex dans config/packages/ de l'application.
# Il enregistre les Twig hooks du thème.

# Panier, compte et pages de contenu (US-224) : copier aussi config/twig_hooks/ dans l'application.
imports:
    - { resource: '../twig_hooks/cart_account.yaml' }

# Gabarits des hooks (panier, compte, pages de contenu) : namespace toujours résolu, même sur un canal sans le thème.
# Chacun inclut le gabarit du cœur tant que le thème n'est pas actif sur le canal courant.
twig:
    paths:
        '%kernel.project_dir%/vendor/tmonier/sylius-industry-trade-theme/templates/hooks': TmonierSyliusIndustryTradeTheme
