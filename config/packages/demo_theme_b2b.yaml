# US-013: B2B shop theme, derived from the official Sylius theme (additive hooks + one extra stylesheet).
# Everything is limited to the B2B channel; the B2C channel keeps the stock theme. Plugin hookables are untouched.
sylius_twig_hooks:
    hooks:
        'sylius_shop.base#stylesheets':
            b2b_theme:
                template: 'shop/theme_b2b/stylesheets.html.twig'
                priority: -100
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        # Logo: the core hookable is kept for B2C, the B2B one replaces it on the B2B channel only.
        'sylius_shop.base.header.content':
            logo:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_logo:
                template: 'shop/theme_b2b/logo.html.twig'
                priority: 300
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            # US-186: aisles and services in the row of the header, after the logo (300), before the account (200) and the cart (100).
            b2b_nav:
                template: 'shop/theme_b2b/nav.html.twig'
                priority: 250
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        # US-192: a signed-in buyer keeps the cart, the favourites and ONE account button: "Hello <name>!" with a dropdown on a wide
        # screen, the usual icon on a phone. The core "mobile" and "desktop" blocks stay on B2C only (the inline links of the
        # desktop hook, plugins' included, go). The entries are the hookables of ...logged_in_user.mobile.menu: add or hide one
        # there, not in the button.
        'sylius_shop.base.header.content.security.logged_in_user':
            mobile:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            desktop:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_account_menu:
                template: 'shop/theme_b2b/account_menu.html.twig'
                priority: 50
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.base.header.top_bar':
            # US-144: the core newsletter offer (-20 %) means nothing in the demo, on either channel.
            info_message:
                enabled: false
            b2b_message:
                template: 'shop/theme_b2b/top_bar.html.twig'
                priority: 150
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        'sylius_shop.base.footer':
            b2b_strip:
                template: 'shop/theme_b2b/footer_strip.html.twig'
                priority: 100
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        # Catalogue cards: SKU under the name, "excl. VAT" next to the price.
        'sylius_shop.shared.product.card.details':
            b2b_sku:
                template: 'shop/theme_b2b/product_card_sku.html.twig'
                priority: -10
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_meta:
                template: 'shop/theme_b2b/product_card_meta.html.twig'
                priority: -20
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.shared.product.card.prices':
            b2b_from_price:
                template: 'shop/theme_b2b/product_card_from_price.html.twig'
                priority: -20
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_price_note:
                template: 'shop/theme_b2b/product_card_price_note.html.twig'
                priority: -10
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        # US-091: discount of the volume tiers and of the company price in the cart summary, under the items total.
        'sylius_shop.cart.index.content.form.sections.general.summary':
            b2b_tier_discount:
                template: 'shop/theme_b2b/cart_tier_discount.html.twig'
                priority: 450
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        # S4-R3: one batch for the cards of the page (variants, prices, images) instead of a few queries per card.
        'sylius_shop.product.index.content.body.main':
            b2b_preload:
                template: 'shop/theme_b2b/product_list_preload.html.twig'
                priority: 150

        # US-189: editorial product page (shop/theme_b2b/pdp/, layout of the four bundle overrides under templates/bundles/SyliusShopBundle/product/show).
        # Right column: aisle above the title (520, core header 500), reference (490), rating (400), BUY BOX from the price (300) to the
        # secondary actions (opened at 350, closed at 5, after the favourites button at 10; plugins add their blocks in between), assurances (3), plugins' call to action (-10).
        # The core short description (the same text as the description, in the body) and accordion (sections of the body), and the core
        # "latest products" listing (replaced by the neighbours of the aisle) stay on B2C only.
        'sylius_shop.product.show.content.info.summary':
            b2b_eyebrow:
                template: 'shop/theme_b2b/pdp/eyebrow.html.twig'
                priority: 520
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_reference:
                template: 'shop/theme_b2b/product_reference.html.twig'
                priority: 490
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_buybox_open:
                template: 'shop/theme_b2b/pdp/buybox_open.html.twig'
                priority: 350
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_buybox_close:
                template: 'shop/theme_b2b/pdp/buybox_close.html.twig'
                priority: 5
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_assurances:
                template: 'shop/theme_b2b/pdp/assurances.html.twig'
                priority: 3
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            short_description:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.product.show.content.info.summary.prices':
            b2b_stock:
                template: 'shop/theme_b2b/pdp/stock.html.twig'
                priority: 50
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.product.show.content.info.overview':
            accordion:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_norm:
                template: 'shop/theme_b2b/pdp/norm.html.twig'
                priority: 200
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.product.show.content':
            product_listing:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_lower:
                template: 'shop/theme_b2b/pdp/lower.html.twig'
                priority: 50
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_related:
                template: 'shop/theme_b2b/pdp/related.html.twig'
                priority: 0
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"

        # US-186: editorial B2B homepage, in the order of the validated mock-up. The core banner stays on B2C; the other core
        # homepage blocks are kept ("New collection" is B2C only too, see tmonier_plugins_overrides.yaml: US-045).
        'sylius_shop.homepage.index.head':
            b2b_hero_preload:
                template: 'shop/theme_b2b/home_hero_preload.html.twig'
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.homepage.index':
            banner:
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_hero:
                template: 'shop/theme_b2b/home_hero.html.twig'
                priority: 400
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_commitments:
                template: 'shop/theme_b2b/home_commitments.html.twig'
                priority: 390
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            # US-089: signed in, three product blocks (usual references, restock, negotiated promotions) right after the
            # commitments; anonymous, the roles presentation further down, without product or price. Channel Access decides
            # who sees prices (the aisles stay visible to visitors).
            b2b_buyer:
                template: 'shop/theme_b2b/home_buyer.html.twig'
                priority: 380
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL') and is_granted('TMONIER_CHANNEL_ACCESS_SEE_PRICES')"
            b2b_aisles:
                template: 'shop/theme_b2b/home_aisles.html.twig'
                priority: 350
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_services:
                template: 'shop/theme_b2b/home_services.html.twig'
                priority: 320
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
            b2b_roles:
                template: 'shop/theme_b2b/home_roles.html.twig'
                priority: 300
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL') and not is_granted('TMONIER_CHANNEL_ACCESS_SEE_PRICES')"
            # US-113: who designed the demo and how it was made close the home, inside the behind-the-scenes section.
            b2b_backstage:
                template: 'shop/theme_b2b/home_backstage.html.twig'
                priority: 280
                condition: "@=not is_granted('DEMO_CONSUMER_CHANNEL')"
