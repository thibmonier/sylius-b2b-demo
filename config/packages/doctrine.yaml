parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_mapping: true
        # Workaround (US-026): the PunchOut plugin targets the Sylius mapped superclasses
        # (Buyer#customer and #channel, PunchoutSession#cart, ReceivedPurchaseOrder#order). Point them to the
        # concrete demo entities. The real fix belongs in the plugin (target the interfaces).
        resolve_target_entities:
            Sylius\Component\Core\Model\Customer: App\Entity\Customer\Customer
            Sylius\Component\Core\Model\Order: App\Entity\Order\Order
            Sylius\Component\Core\Model\Channel: App\Entity\Channel\Channel
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@prod: &doctrine_prod
    doctrine:
        orm:
            metadata_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test_cached: *doctrine_prod
