framework:
    messenger:
        transports:
            # Sprint 55 (T-TECH-55-03): the first asynchronous transport of the demo. The company verification calls two public
            # services (API Recherche d'entreprises, VIES; 7 to 8 seconds for VIES): never inside a web request or a fixture load.
            # The table is created by a migration (auto_setup=0: the web user never creates tables); it is consumed by the
            # crontab (docker/crontab), see ADR-0002.
            async: 'doctrine://default?auto_setup=0'
            sync: 'sync://'

        routing:
            # Only this message is asynchronous: every other message of the demo stays synchronous.
            'Tmonier\SyliusCompanyVerificationPlugin\Message\VerifyCompany': async

# Tests stay deterministic: the message is kept in memory, never handled, no network.
when@test: &messenger_test
    framework:
        messenger:
            transports:
                async: 'in-memory://'

when@test_cached: *messenger_test
