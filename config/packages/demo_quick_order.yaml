# US-086 / US-139: the quick order page shows lines that work in this catalogue (fixtures/csv/*.csv), not the neutral
# example of the plugin. Since the plugin 1.2 the example comes from its `example_lines` option (no template override).
parameters:
    demo.quick_order_example_lines: "VISS-001;2\nVISS-002,10\nVISS-003\t5"

tmonier_sylius_quick_order:
    example_lines: '%demo.quick_order_example_lines%'
