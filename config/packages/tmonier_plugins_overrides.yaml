# US-044: loaded after tmonier_plugins.yaml (alphabetical order), so that it wins the merge of the Twig hook.
# The PunchOut and container-fill plugins both register `checkout` under the cart summary: without this, the
# PunchOut template wins and the checkout button is never disabled by the fill rules.
sylius_twig_hooks:
    hooks:
        'sylius_shop.cart.index.content.form.sections.general#right':
            checkout:
                template: 'shop/container_fill/cart_checkout.html.twig'

        # US-045: the fashion "New collection" block stays on B2C only. channel-access sets its own condition on this
        # block (catalogue visibility); a condition is replaced, not combined, by the merge, so both are kept here.
        'sylius_shop.homepage.index':
            new_collection:
                condition: "@=is_granted('TMONIER_CHANNEL_ACCESS_SEE_CATALOG') and is_granted('DEMO_CONSUMER_CHANNEL')"

# US-087: the nightly reset (app:demo:reset) reloads the fixtures in-process: its ~1000 "Création" entries would
# bury the audit log of the visitors. The defaults of the plugin are repeated because the list replaces them.
tmonier_sylius_audit_log:
    ignored_commands:
        - 'sylius:fixtures:load'
        - 'doctrine:fixtures:load'
        - 'app:demo:reset'
