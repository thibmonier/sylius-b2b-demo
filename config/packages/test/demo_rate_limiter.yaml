# The counters of the demo limiters live in the cache directory of the test run (APP_CACHE_DIR, see bin/run-tests), emptied by
# tests/bootstrap.php at the start of each run: a run never inherits the counters of the previous one, and two runs on two
# cache directories never empty each other's counters (the tests lower a limit and count requests of a random visitor IP).
framework:
    cache:
        pools:
            cache.demo_rate_limiter:
                adapter: demo.rate_limiter.storage

services:
    demo.rate_limiter.storage:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['demo_limiter', 0, '%kernel.cache_dir%/demo-limiter-test']
