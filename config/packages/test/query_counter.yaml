# S4-R3 / T-041-09: counts the SQL statements of a request so that a test can assert the count does not grow with the list.
services:
    App\Tests\Support\QueryCounter:
        tags: ['doctrine.middleware']

    # US-048 / T-048-04: per-fixture profile of the reset (bin/profile-reset); a pass-through without PROFILE_RESET_OUT.
    App\Tests\Support\FixtureProfiler:
        decorates: 'sylius_fixtures.fixture_loader'
        arguments: ['@.inner']
