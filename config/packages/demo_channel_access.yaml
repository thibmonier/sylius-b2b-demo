# US-019: the channel access plugin. The B2B channel hides its prices (fixture demo_channel_access); if a channel is
# set to "closed", anonymous visitors only reach the home page, the login, the registration (built in), the
# administration (built in) and the routes below, which carry their own authentication or are public on purpose.
tmonier_sylius_channel_access:
    # Routes of the other plugins that show or use prices (on top of the built-in cart, checkout and orders), refused to a
    # visitor who may not see prices; a customer still waiting for approval (US-020) is turned away the same way.
    restricted_routes:
        # Quote request form: its lines show the catalogue price of the products.
        - 'tmonier_quote_request_shop_new'
        - 'tmonier_quote_request_shop_basket_add'
        - 'tmonier_quote_request_shop_from_cart'
        - 'tmonier_quote_request_shop_release_cart'
        # Quick order and quantity matrix: the lines are added to the cart without the order modifier.
        - 'tmonier_quick_order_shop_add'
        - 'tmonier_quick_order_shop_matrix_add'
        # AI assistants (MCP): the consent screen and the connections give an assistant the access of the customer.
        - 'tmonier_b2b_mcp_shop_*'
    restricted_paths:
        # Volume prices of a variant (tmonier/sylius-tier-pricing-plugin): unit price per quantity break.
        - '%sylius.security.api_shop_route%/product-variants/*/tier-prices'
    exempt_paths:
        # PunchOut (cXML / OCI): authenticated by the buyer credentials.
        - '/punchout/*'
        # MCP server and its OAuth endpoints: authenticated by token.
        - '/_mcp'
        - '/mcp-oauth/*'
        - '/.well-known/*'
        # Product feeds (access token on the B2B feeds, see demo_hidden_prices_feeds).
        - '/feeds/*'
        # The demo itself: accounts, mailbox, channel and badge switches.
        - '/demo/*'

# Pieces of the other plugins that show prices on the product page: shown only to those who may see prices
# (the channel access plugin disables the core price blocks the same way). The JSON-LD stays on the B2C channel.
sylius_twig_hooks:
    hooks:
        'sylius_shop.product.show':
            # schema.org Product/Offer: "price" and "priceCurrency".
            tmonier_agentic_feeds_json_ld:
                condition: "@=is_granted('TMONIER_CHANNEL_ACCESS_SEE_PRICES')"
        'sylius_shop.product.show.content.info.summary':
            # Quantity matrix: price of every cell and estimate.
            tmonier_quick_order_matrix:
                condition: "@=is_granted('TMONIER_CHANNEL_ACCESS_SEE_PRICES')"
