# Demo data suite (ADR-0007). Sprint 1: channels, locales, geography, taxes, shipping and payment
# (US-007). The catalogue, companies and plugin data come with sprint 2.
sylius_fixtures:
    suites:
        demo:
            listeners:
                orm_purger: ~
                logger: ~
                # US-048: end-of-load marker, written after the last fixture (read by docker/entrypoint.sh).
                demo_load_marker: ~

            fixtures:
                locale:
                    options:
                        locales: ['fr_FR', 'en_US']

                currency:
                    options:
                        currencies: ['EUR']

                geographical:
                    options:
                        countries: ['FR', 'BE', 'LU', 'DE', 'ES', 'IT', 'NL', 'CH']
                        zones:
                            FR:
                                name: 'France'
                                countries: ['FR']
                            EU:
                                name: 'Europe'
                                # US-202: a delivery zone only. As a tax zone it would hide the VAT of France once the delivery address is known
                                # (the shop picks one zone for an address that belongs to both).
                                scope: 'shipping'
                                countries: ['FR', 'BE', 'LU', 'DE', 'ES', 'IT', 'NL']

                channel:
                    options:
                        custom:
                            b2b:
                                name: 'Fournitures Pro — B2B'
                                code: 'B2B'
                                hostname: ~
                                color: '#1f3a5f'
                                enabled: true
                                locales: ['fr_FR', 'en_US']
                                default_locale: 'fr_FR'
                                currencies: ['EUR']
                                base_currency: 'EUR'
                                default_tax_zone: 'FR'
                                account_verification_required: false
                                contact_email: 'contact@fournitures-pro.example'
                                shop_billing_data:
                                    company: 'Fournitures Pro SAS (fictive)'
                                    tax_id: 'FR00123456789'
                                    country_code: 'FR'
                                    street: '1 rue de la Démo'
                                    city: 'Lyon'
                                    postcode: '69001'
                            b2c:
                                name: 'Fournitures Pro — Particuliers'
                                code: 'B2C'
                                hostname: ~
                                color: '#2e7d5b'
                                enabled: true
                                locales: ['fr_FR', 'en_US']
                                default_locale: 'fr_FR'
                                currencies: ['EUR']
                                base_currency: 'EUR'
                                default_tax_zone: 'FR'
                                account_verification_required: false
                                contact_email: 'contact@fournitures-pro.example'

                tax_category:
                    options:
                        custom:
                            standard:
                                code: 'standard'
                                name: 'TVA normale'

                tax_rate:
                    options:
                        custom:
                            fr_standard:
                                code: 'fr_standard'
                                name: 'TVA'
                                zone: 'FR'
                                category: 'standard'
                                amount: 0.2
                                included_in_price: false

                shipping_method:
                    options:
                        custom:
                            carrier:
                                code: 'carrier'
                                name: 'Messagerie (48 h)'
                                description: 'Livraison par messagerie sous 48 h ouvrées'
                                zone: 'EU'
                                tax_category: 'standard'
                                enabled: true
                                channels: ['B2B', 'B2C']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        B2B: { amount: 1500 }
                                        B2C: { amount: 690 }
                            pickup:
                                code: 'pickup'
                                name: 'Retrait au dépôt de Lyon'
                                description: 'Retrait gratuit au dépôt, sous 24 h'
                                zone: 'FR'
                                enabled: true
                                channels: ['B2B', 'B2C']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        B2B: { amount: 0 }
                                        B2C: { amount: 0 }

                payment_method:
                    options:
                        custom:
                            bank_transfer:
                                code: 'bank_transfer'
                                name: 'Virement bancaire'
                                description: 'Paiement par virement à réception de facture'
                                instructions: 'Démo : aucun paiement réel.'
                                gatewayName: 'offline'
                                gatewayFactory: 'offline'
                                enabled: true
                                channels: ['B2B', 'B2C']
                            # US-026 (I3): payment on account (net 30), B2B only. The trade-credit policy
                            # is attached by the demo_trade_credit fixture; the PunchOut buyer uses it.
                            on_account:
                                code: 'on_account'
                                name: 'Paiement à 30 jours (sur compte)'
                                description: 'Facturation à 30 jours, dans la limite du crédit de l’entreprise'
                                instructions: 'Démo : aucun paiement réel.'
                                gatewayName: 'offline'
                                gatewayFactory: 'offline'
                                enabled: true
                                channels: ['B2B']

                # Back-office users come from config/demo/accounts.yaml (single source, US-015).
                admin_user:
                    options:
                        custom: '%demo.admin_users%'

                # US-035: every back-office account of the catalogue becomes ROLE_DEMO_ADMIN (restricted writes).
                # Runs right after admin_user (0).
                demo_admin_role:
                    priority: -1

                # Sprint 2 — US-008: Catalogue industriel (CSV).
                # La PriorityQueue de SyliusFixturesBundle trie en SORT_DESC (priorité
                # haute = exécutée en premier) ; les fixtures de base (canaux, locales…)
                # sont à 0. Priorités négatives pour charger APRÈS elles, dans l'ordre
                # taxons → attributs → produits (les produits ont besoin des trois).
                demo_taxons:
                    priority: -10

                demo_product_attributes:
                    priority: -20

                demo_products_csv:
                    priority: -30

                # Sprint 2 — US-009: Entreprises B2B et membres.
                # Priorités négatives pour charger après la base (canaux, locales…).
                # -15 : après les taxons (-10) mais avant les produits (-30).
                # demo_companies et demo_customers sont indépendants des produits.
                demo_companies:
                    priority: -15

                demo_customers:
                    priority: -15

                # Sprint 2 — US-010: Plugin data (trade-credit, tier-pricing, purchase-approval).
                # Depend on products (-30) AND companies (-15) → priority -40 (runs after both).
                demo_trade_credit:
                    priority: -40

                demo_tier_pricing:
                    priority: -40

                demo_purchase_approval:
                    priority: -40

                # Sprint 5 — US-024: shared purchase list "Atelier" of Acme.
                # Needs products (-30) AND companies (-15) → -40.
                demo_company_wishlists:
                    priority: -40

                # Sprint 38 — US-243: two registrations waiting for Sophie (Registration Approval demo, registrations closed
                # in public mode). Needs only the schema.
                demo_pending_registrations:
                    priority: -20

                # Sprint 21 — US-060: equipment models (compatible variants) and the fleet of Claire. Needs the products
                # (-30) and the customers (-15); its own priority.
                demo_equipment_fleet:
                    priority: -45

                # Sprint 5 — US-025: shared address book of Acme ("Usine de Lyon"…). Needs companies (-15).
                demo_company_addresses:
                    priority: -40

                # Sprint 2 — US-010: Plugin data (quotes, GPSR, punchout).
                # Depend on products (-30), companies (-15), and some on group-1 fixtures (-40).
                # Priority -50 guarantees correct order.
                demo_quotes:
                    priority: -50

                demo_gpsr:
                    priority: -50

                # Sprint 5 — US-011: Factur-X seller settings of the B2B channel, before the orders.
                demo_facturx_settings:
                    priority: -55

                # Sprint 5 — US-011: order history with invoices. Needs products (-30), companies (-15),
                # buyer limits (-40) and the PO reference channel setup (-5) → -60.
                demo_orders:
                    priority: -60

                demo_punchout:
                    priority: -50

                # Sprint 37 — US-241: Digital product passports for 3 representative EPI products (helmets).
                # Depends on products (-30) → priority -50.
                demo_digital_passports:
                    priority: -50

                # Agentic feeds: creates feed configurations per channel.
                # Uses built-in plugin fixture; no extra options needed.
                tmonier_agentic_feeds:
                    priority: -50

                # US-021: Configure B2B channel to require PO reference and enable cost center.
                # Runs after channel fixture (priority 0) → priority -5.
                demo_po_reference_channel:
                    priority: -5

                # US-019: the B2B channel hides its prices from visitors who are not signed in (B2C stays open).
                demo_channel_access:
                    priority: -6

                # US-019: the feeds of the B2B channel carry prices: they get an access token (after the feeds, -50).
                demo_hidden_prices_feeds:
                    priority: -60

                # US-044: the plugin's own container presets (13 pallets, trucks, sea containers and cartons), as is.
                # They read the locales and need no catalogue → -5 (after locale and channel, 0). The plugin demo
                # fixture (tmonier_container_fill_demo) is NOT loaded: English-only products, a rule on every channel
                # and a buyer account with a known password.
                tmonier_container_fill_container_types:
                    priority: -5

                # US-044: logistics data, capacities and B2B rules derived from the catalogue CSV. After the products
                # (-30) and the presets (-5), and after demo_orders (-60): the orders complete through the plugin's
                # workflow guard, which would refuse the demo history (a few packs, no full pallet) once the rules exist.
                demo_container_fill:
                    priority: -70

                # US-096 / US-097: living data, after the order history (-60) and the container-fill data (-70) and
                # before the webhook endpoint (-80): the fixtures themselves must not queue webhooks. One priority each.
                # The starting cart of Claire (the Atelier list of Acme).
                demo_cart:
                    priority: -71

                # Orders in preparation (drafts) started in the back office.
                demo_draft_orders:
                    priority: -72

                # AI suggestions pre-generated by the plugin's demo generator (no AI provider is called). French
                # descriptions in the shop language, translations to English.
                tmonier_ai_copilot_demo_suggestions:
                    priority: -73
                    options:
                        products: 6
                        locale: 'fr_FR'
                        translation_locale: 'en_US'

                # A handful of business events in the audit log (the reset command is ignored by the log, US-087).
                demo_audit_log:
                    priority: -74

                # US-029: the webhook endpoint of the demo (receiver of the container). After the order history (-60) and the
                # container-fill data (-70): the fixtures themselves must not queue webhooks.
                demo_webhook_endpoint:
                    priority: -80

                # US-198: the stock of every variant is tracked (fictitious quantities from the SKU). After the orders (-60), the carts
                # and the draft orders (-72) that would otherwise hold stock, before the ERP exchange (-90) whose stock file carries these quantities.
                demo_catalog_stock:
                    priority: -85

                # US-193: the last placed orders of each channel in the outbox, then one export: the page "Flat-file exchange" shows a real
                # file. After the webhook endpoint (-80): the fixtures queue no delivery.
                demo_erp_export:
                    priority: -90
