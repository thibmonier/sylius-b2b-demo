# Consumer-only features of the plugins are shown on the B2C channel only (ADR-0009).
sylius_twig_hooks:
    hooks:
        # US-015: demo banner above the shop header, demo accounts on both login pages.
        'sylius_shop.base.header':
            demo_banner:
                template: 'demo/banner.html.twig'
                priority: 400
            # US-186: "demonstration e-shop" notice under the header (core navbar 100, flashes 0), both channels, every shop page.
            demo_notice:
                template: 'demo/_notice.html.twig'
                priority: 50
        # US-191: the classic form (login_container, 100) first, the demo accounts after it (50), then the registration box (0).
        'sylius_shop.account.login.content':
            demo_accounts:
                template: 'demo/login_accounts_shop.html.twig'
                priority: 50
        'sylius_admin.security.login.page.content':
            demo_accounts:
                template: 'demo/login_accounts_admin.html.twig'
                priority: -100
        'sylius_shop.base.footer.content.menu.help_links':
            tmonier_withdrawal:
                template: '@TmonierSyliusWithdrawalPlugin/shop/footer/withdrawal_link.html.twig'
                priority: -100
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
        'sylius_shop.account.order.show.content.main.header.buttons':
            tmonier_withdrawal:
                template: '@TmonierSyliusWithdrawalPlugin/shop/account_order/withdrawal_button.html.twig'
                priority: -100
                condition: "@=is_granted('DEMO_CONSUMER_CHANNEL')"
        # US-021: PO reference and cost center block at checkout complete step.
        'sylius_shop.checkout.complete.content.form':
            po_reference:
                template: 'checkout/po_reference_block.html.twig'
                priority: 150
        # US-022: PO reference and cost center on the admin order page (summary card rows).
        'sylius_admin.order.show.content.sections.summary':
            po_reference:
                template: 'admin/order/po_reference_summary.html.twig'
                priority: 400

# US-022: PO reference column and filter in the admin order grid.
sylius_grid:
    grids:
        sylius_admin_order:
            fields:
                poReference:
                    type: string
                    label: app.ui.po_reference
                    sortable: ~
                    position: 25
            filters:
                poReference:
                    type: string
                    label: app.ui.po_reference
                    form_options:
                        type: contains
