# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: demo/accounts.yaml }
    - { resource: demo/legal.yaml }
    - { resource: demo/plugins.yaml }

parameters:

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Demo/Account/DemoAccount.php'
            - '../src/Demo/Account/DemoCompany.php'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Demo\Controller\:
        resource: '../src/Demo/Controller'
        tags: ['controller.service_arguments']

    # Demo channel (ADR-0011): the switcher cookie decides between B2B and B2C on one domain
    App\Demo\Channel\DemoChannelContext:
        arguments:
            $channelRepository: '@sylius.repository.channel'
        tags:
            - { name: sylius.context.channel, priority: 200 }

    App\Demo\Channel\ChannelSwitchController:
        tags: ['controller.service_arguments']

    App\Demo\Channel\ConsumerChannelVoter:
        arguments:
            $channelContext: '@sylius.context.channel'

    # US-027 workaround (remove with the punchout-cxml fixes, sprint 7): PunchOut carts are not guest orders,
    # so the on-account payment of an OrderRequest can reserve Acme's trade credit.
    App\PunchOut\AuthorizedPunchOutOrderFactory:
        arguments:
            $orderFactory: '@sylius.factory.order'

    Tmonier\SyliusPunchoutCxmlPlugin\Cart\PunchoutCartFactory:
        arguments:
            $orderFactory: '@App\PunchOut\AuthorizedPunchOutOrderFactory'

    # US-011: Sylius' order example factory without its random lines/addresses (demo order history).
    App\Demo\Order\DeterministicOrderFactory:
        class: App\Demo\Order\DeterministicOrderFactory
        parent: sylius.fixture.example_factory.order
        calls:
            - setVariantRepository: ['@sylius.repository.product_variant']

    # US-022: Factur-X BT-10 BuyerReference from the order PO reference (decorates the plugin XML writer).
    App\Invoice\PoReferenceCiiXmlWriter:
        decorates: 'tmonier_facturx.xml.writer'
        decoration_on_invalid: ignore
        arguments:
            $inner: '@.inner'
            $orderRepository: '@sylius.repository.order'
            $logger: '@logger'
