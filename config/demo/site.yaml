# US-074: author's site and contact page, linked from the shop footer (and the demo bar, US-076).
# Empty or not a plain https URL = no link (the author mention stays plain text). Set them in the environment:
# DEMO_SITE_URL, DEMO_CONTACT_URL.
parameters:
    env(DEMO_SITE_URL): ''
    env(DEMO_CONTACT_URL): ''
    demo.site_url: '%env(DEMO_SITE_URL)%'
    demo.contact_url: '%env(DEMO_CONTACT_URL)%'
