# Single source of truth for the showcased plugins (US-014); the figure shown in the pages is counted from it (US-087). Consumed by the Plugins page, the
# About page and (later) the plugin badges through App\Demo\Plugin\DemoPluginCatalog.
# slug = GitHub repository name = Packagist package "tmonier/<slug>"; descriptions come from each
# plugin's composer.json. demo_route = name of a real shop route showing the plugin (null when the
# plugin is only visible in the admin panel, the API or at checkout). Categories: purchasing,
# billing, catalog, integration, compliance, admin. published: false = not on Packagist yet; installed: false = not
# installed in this demo (card marked "coming soon" instead of "in progress").
parameters:
    demo.plugin_catalog:
        - slug: sylius-admin-order-creation-plugin
          name: 'Admin Order Creation'
          category: admin
          description:
              fr: "Créez des commandes pour le compte des clients (commandes téléphone et back-office) depuis l'administration Sylius 2."
              en: 'Create orders on behalf of customers (phone and back-office orders) from the Sylius 2 admin panel.'
          demo_route: null
          scenario:
              fr: "Sophie crée une commande pour Claire d'ACME et, à l'étape adresse, choisit une adresse de l'entreprise (Usine de Lyon, par exemple) ; rejouez ensuite une ancienne commande."
              en: "Sophie creates an order for Claire of ACME and, at the address step, picks a company address (the Lyon plant, for instance); then replay a past order."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-agentic-feeds-plugin
          name: 'Agentic Feeds'
          category: integration
          description:
              fr: "Flux produits pour assistants d'achat IA et comparateurs : Google Merchant Center, OpenAI, Stripe Agentic Commerce, par canal, locale et devise, avec rapports de validation."
              en: 'Product feeds for AI shopping assistants and comparison engines: Google Merchant Center, OpenAI, Stripe Agentic Commerce, per channel, locale and currency, with validation reports.'
          demo_route: null
          scenario:
              fr: "Générez un flux produits Google Merchant ou OpenAI pour le canal B2B et consultez son rapport de validation."
              en: "Generate a Google Merchant or OpenAI product feed for the B2B channel and read its validation report."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-ai-catalog-copilot-plugin
          name: 'AI Catalog Copilot'
          category: catalog
          description:
              fr: "Copilote IA du catalogue dans l'administration : suggestions de descriptions, méta et traductions produit à relire, via Symfony AI."
              en: 'AI catalog copilot for the admin: reviewable product description, meta and translation suggestions through Symfony AI.'
          demo_route: null
          scenario:
              fr: "Sur une fiche produit, demandez une description et une méta suggérées par l'IA, relisez-les puis acceptez-les."
              en: "On a product page, ask the AI for a suggested description and meta, review them, then accept them."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-audit-log-plugin
          name: 'Audit Log'
          category: admin
          description:
              fr: "Journal d'audit des modifications de l'administration : qui a changé quoi, et quand."
              en: 'Audit log of admin changes: who changed what, and when.'
          demo_route: null
          scenario:
              fr: "Modifiez le prix d'un produit puis ouvrez son historique pour voir qui a changé quoi, et quand."
              en: "Change a product's price, then open its history to see who changed what, and when."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-b2b-mcp-plugin
          name: 'B2B MCP'
          category: integration
          description:
              fr: "Outils B2B pour le serveur MCP officiel de Sylius : les acheteurs connectés utilisent Claude ou ChatGPT pour lister et recommander leurs commandes, commander par SKU, demander des devis et lire leur relevé de crédit (OAuth 2.1 avec PKCE)."
              en: 'B2B tools for the official Sylius MCP server: signed-in buyers use Claude or ChatGPT to list and reorder their orders, quick order by SKU, request quotes and read their trade credit statement (OAuth 2.1 with PKCE).'
          demo_route: tmonier_b2b_mcp_shop_connections
          scenario:
              fr: "Connectez un assistant IA à votre compte acheteur, puis demandez-lui de lister vos commandes et de recommander l'une d'elles."
              en: "Connect an AI assistant to your buyer account, then ask it to list your orders and reorder one."
          advised_account: claire@acme.example
        - slug: sylius-bulk-actions-plugin
          name: 'Bulk Actions'
          category: admin
          description:
              fr: "Actions groupées sur les grilles de l'administration : activer/désactiver, taxons et canaux des produits, annuler des commandes, marquer des paiements comme payés, expédier, groupes de clients."
              en: 'Bulk actions for the admin grids: enable/disable, taxons and channels for products, cancel orders, mark payments as paid, ship shipments, customer groups.'
          demo_route: null
          scenario:
              fr: "Dans la liste des produits, sélectionnez plusieurs lignes et désactivez-les, ou changez leurs taxons, en une seule action."
              en: "In the product list, select several rows and disable them, or change their taxons, in a single action."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-channel-access-plugin
          name: 'Channel Access'
          category: catalog
          description:
              fr: "Mode d'accès par canal (ouvert, prix masqués, fermé) : le catalogue, les prix et l'achat sont réservés aux clients connectés, côté pages comme côté API boutique, avec une liste blanche de routes exemptées."
              en: 'Per-channel access mode (open, prices hidden, closed): the catalogue, prices and purchase are reserved for signed-in customers, on the pages as well as in the shop API, with an allow-list of exempt routes.'
          demo_route: null
          scenario:
              fr: "Ouvrez une fiche produit du canal B2B sans être connecté : aucun prix ni bouton d'achat, un lien invite à se connecter. Connectez-vous : les prix et l'achat apparaissent. Le canal Particuliers reste ouvert."
              en: "Open a B2B product page without signing in: no price and no buy button, a link invites you to sign in. Sign in: prices and purchase appear. The consumer channel stays open."
          advised_account: claire@acme.example
        - slug: sylius-command-palette-plugin
          name: 'Command Palette'
          category: admin
          description:
              fr: "Palette de commandes (Ctrl+K / Cmd+K) pour l'administration : recherche globale des commandes, clients, produits, promotions et pages d'administration."
              en: 'Command palette (Ctrl+K / Cmd+K global search) for the admin: orders, customers, products, promotions and admin pages.'
          demo_route: null
          scenario:
              fr: "Dans l'administration, appuyez sur Ctrl+K et tapez le nom d'un client ou un numéro de commande pour y accéder directement."
              en: "In the admin, press Ctrl+K and type a customer name or an order number to jump straight to it."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-company-accounts-plugin
          name: 'Company Accounts'
          category: purchasing
          description:
              fr: "Comptes entreprise B2B : sociétés avec membres et rôles (admin, acheteur, approbateur), espace société dans le compte client (membres, commandes de la société), CRUD admin, API boutique et admin."
              en: 'B2B company accounts: companies with members and roles (admin, buyer, approver), company area in the customer account (members, company orders), admin CRUD, shop and admin API.'
          demo_route: tmonier_company_accounts_shop_company_show
          scenario:
              fr: "Ouvrez l'espace société de votre compte : consultez les membres de la société, leurs rôles (admin, acheteur, approbateur) et les commandes de la société."
              en: "Open your account's company area: see the company members, their roles (admin, buyer, approver) and the company's orders."
          advised_account: isabelle@acme.example
        - slug: sylius-company-insights-plugin
          name: 'Company Insights'
          category: purchasing
          description:
              fr: "Tableau de bord des achats pour les comptes entreprise B2B : dépenses, commandes, panier moyen et acheteurs actifs de la période avec leur variation, achats mois par mois sur 12 mois face à l'année précédente, classements des acheteurs, produits et catégories, répartition par site de livraison et par centre de coût, export CSV du détail, et indicateurs des approbations et de l'encours. Réservé aux administrateurs de la société."
              en: 'Purchasing dashboard for B2B company accounts: spend, orders, average basket and active buyers of the period with their variation, purchases month by month over 12 months against the previous year, rankings of buyers, products and categories, a split per delivery site and per cost centre, a CSV export of the detail, and indicators for approvals and outstanding credit. Reserved to the company administrators.'
          demo_route: tmonier_company_insights_shop_insights
          scenario:
              fr: "Connectez-vous en Isabelle (administratrice d'Acme) et ouvrez l'onglet « Tableau de bord des achats » de l'espace société : douze mois d'achats avec le creux d'août et le pic de septembre, comparés à l'année précédente, puis les acheteurs, produits et catégories qui comptent. Plus bas, les achats par site de livraison (Usine de Lyon, Entrepôt de Saint-Priest, Atelier de Grenoble) et par centre de coût (ATELIER-01, MAINT-02), puis les blocs Approbations (la commande de Claire attend une décision depuis plusieurs jours) et Encours. Le bouton d'export télécharge le détail en CSV, référence PO comprise. Les commandes de TechParts n'y figurent pas."
              en: "Sign in as Isabelle (Acme administrator) and open the \"Purchasing dashboard\" tab of the company area: twelve months of purchases with the August trough and the September peak, compared with the previous year, then the buyers, products and categories that count. Further down, purchases per delivery site (Lyon plant, Saint-Priest warehouse, Grenoble workshop) and per cost centre (ATELIER-01, MAINT-02), then the Approvals block (Claire's order has waited several days for a decision) and the Outstanding credit block. The export button downloads the detail as CSV, PO reference included. The orders of TechParts are not in it."
          advised_account: isabelle@acme.example
        - slug: sylius-container-fill-plugin
          name: 'Container Fill'
          category: purchasing
          description:
              fr: "Pallet & Truckload Builder : types de conteneurs, données logistiques par variante, planificateur de chargement avec jauge de remplissage dans le panier, règles B2B appliquées au checkout, expédition par conteneur."
              en: 'Pallet & Truckload Builder: container types, logistics data per variant, a load planner with a fill gauge in the cart, B2B fill rules enforced at checkout, per-container shipping.'
          demo_route: null
          scenario:
              fr: "Sur le canal B2B, ajoutez 10 cartons « Carton simple cannelure A4 » (EMBA-001, famille Emballage) : la jauge de la palette EUR indique 8 %, la commande est désactivée avec la raison et un bouton arrondit à la couche. À 117 cartons (13 couches de 9), la palette est complète et la commande passe. Les vis VISS-001 se vendent à la boîte (une boîte de 100 vis tient dans un carton S) : 5 boîtes de VISS-001 et 2 de VISS-002, la liste d'achat d'Atelier, remplissent un carton à plus de 20 % et respectent la règle Visserie. Le canal B2C n'a aucune règle."
              en: "On the B2B channel, add 10 'Single-wall cardboard box A4' (EMBA-001, Packaging family): the EUR pallet gauge shows 8 %, checkout is disabled with the reason and a button rounds up to the layer. At 117 cartons (13 layers of 9) the pallet is full and the order goes through. Hex bolts VISS-001 are sold by the box (a box of 100 bolts fits a carton S): 5 boxes of VISS-001 and 2 of VISS-002, the Atelier shopping list, fill a carton past 20 % and meet the Fasteners rule. The B2C channel has no rule."
          advised_account: claire@acme.example
        - slug: sylius-customer-asset-management-plugin
          name: 'Customer Asset Management'
          category: catalog
          description:
              fr: "Parc d'équipements du client : le client déclare ses machines dans son espace client (modèle, libellé, plaque ou numéro de série) et le catalogue se limite aux pièces compatibles avec son matériel. Les modèles d'équipement et leur compatibilité par variante se gèrent en administration."
              en: 'Customer equipment fleet: customers declare their machines in their account (model, label, plate or serial number) and the catalogue narrows down to the parts compatible with their equipment. Equipment models and their compatibility per variant are managed in the administration.'
          demo_route: tmonier_equipment_shop_fleet_index
          scenario:
              fr: "Connectez-vous en Claire (acheteuse d'Acme) et ouvrez « Mon matériel » dans votre compte : trois machines fictives sont déclarées (chariot, transpalette, perceuse à colonne), partagées avec les membres de la société. Ouvrez ensuite la catégorie Outillage : le contrôle « Compatible avec mon matériel » limite la liste aux pièces compatibles, pour tout le parc ou pour une machine. Dans une catégorie sans pièce compatible, la page le dit et propose de retirer le filtre."
              en: "Sign in as Claire (Acme buyer) and open \"My equipment\" in your account: three fictional machines are declared (forklift, pallet truck, drill press), shared with the members of the company. Then open the Tools category: the \"Compatible with my equipment\" control narrows the list to the compatible parts, for the whole fleet or for one machine. In a category with no compatible part, the page says so and offers to remove the filter."
          advised_account: claire@acme.example
        - slug: sylius-einvoice-transmission-plugin
          name: 'E-invoice Transmission'
          category: billing
          description:
              fr: "Transmission des factures électroniques Factur-X pour Sylius 2 : port de transmission remplaçable, journal des envois avec leurs statuts, écouteur idempotent de l'événement du plugin Factur-X."
              en: 'Transmission of Factur-X electronic invoices for Sylius 2: replaceable transmitter port, log of the sends with their statuses, idempotent listener of the Factur-X plugin event.'
          demo_route: app_demo_fictitious_platform
          scenario:
              fr: "Ouvrez la page de la PA fictive de démonstration : quatre scénarios de statuts simulés, fixés par les données de la démo, sans aucune plateforme réelle."
              en: "Open the fictitious demonstration platform page: four simulated status scenarios, fixed by the demo data, with no real platform."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-erp-flatfile-plugin
          name: 'ERP Flat-file'
          category: integration
          description:
              fr: "Échange par fichiers plats avec un ERP pour Sylius 2 : les commandes passées sont exportées en CSV selon un contrat documenté (UTF-8, séparateur « ; », montants en unité mineure), à partir des événements de l'outbox, et déposées de façon atomique dans un répertoire d'échange."
              en: 'Flat-file exchange with an ERP for Sylius 2: placed orders are exported as CSV files according to a documented contract (UTF-8, ";" separator, minor-unit amounts), from the outbox events, and deposited atomically in an exchange directory.'
          demo_route: app_demo_erp_flatfile
          scenario:
              fr: "Ouvrez la page de l'échange par fichier : les dix colonnes du contrat et un extrait de fichier produit à partir des dernières commandes passées de la démo, adresses masquées, sans aucun ERP nommé."
              en: "Open the flat-file exchange page: the ten columns of the contract and an excerpt of a file produced from the latest placed orders of the demo, addresses masked, with no ERP named."
          advised_account: claire@acme.example
        - slug: sylius-facturx-plugin
          name: 'Factur-X'
          category: billing
          description:
              fr: "Factures électroniques Factur-X / ZUGFeRD (EN 16931) pour le plugin Invoicing de Sylius 2 : PDF/A-3 avec XML CII embarqué."
              en: 'Factur-X / ZUGFeRD (EN 16931) electronic invoices for the Sylius 2 Invoicing Plugin: PDF/A-3 with embedded CII XML.'
          demo_route: null
          scenario:
              fr: "Ouvrez une facture d'une commande dans l'administration et téléchargez sa version Factur-X (PDF/A-3 avec XML CII intégré)."
              en: "Open an order's invoice in the admin and download its Factur-X version (PDF/A-3 with embedded CII XML)."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-gpsr-plugin
          name: 'GPSR'
          category: compliance
          description:
              fr: "Informations de sécurité des produits du règlement européen GPSR (règlement (UE) 2023/988, art. 19)."
              en: 'EU General Product Safety Regulation (GPSR, Regulation (EU) 2023/988, Art. 19) product safety information.'
          demo_route: null
          scenario:
              fr: "Sur une fiche produit, consultez le fabricant, la personne responsable dans l'UE et la notice de sécurité exigés par le GPSR."
              en: "On a product page, read the manufacturer, the EU responsible person and the safety notice required by GPSR."
          advised_account: lea@demo.example
        - slug: sylius-order-hold-plugin
          name: 'Order Hold'
          category: billing
          description:
              fr: "Noyau partagé de mise en attente des commandes : exclut les commandes retenues de l'annulation des impayés, filtre les moyens de paiement partout (boutique, API) et bloque la saisie du paiement."
              en: 'Shared order-hold kernel: keeps held orders out of the unpaid-orders cancellation, filters payment methods everywhere (shop, API) and blocks payment entry.'
          demo_route: null
          scenario:
              fr: "Passez une commande soumise à approbation : elle reste en attente, n'est pas annulée automatiquement et ne peut pas être payée."
              en: "Place an order that needs approval: it stays on hold, is not cancelled automatically and cannot be paid."
          advised_account: claire@acme.example
        - slug: sylius-punchout-cxml-plugin
          name: 'PunchOut cXML'
          category: integration
          description:
              fr: "Connecteur PunchOut cXML/OCI B2B : votre boutique devient fournisseur PunchOut pour les systèmes d'achat (Ariba, SAP, Coupa…)."
              en: 'B2B PunchOut cXML/OCI connector: lets your shop act as a PunchOut supplier for procurement systems (Ariba, SAP, Coupa…).'
          demo_route: tmonier_punchout_inspect
          scenario:
              fr: "Inspectez une session PunchOut simulée d'un système d'achat (Ariba, SAP, Coupa), puis transférez le panier vers votre ERP."
              en: "Inspect a simulated PunchOut session from a procurement system (Ariba, SAP, Coupa), then transfer the cart back to your ERP."
          advised_account: claire@acme.example
        - slug: sylius-purchase-approval-plugin
          name: 'Purchase Approval'
          category: purchasing
          description:
              fr: "Validation des achats pour les comptes entreprise : plafonds de commande et d'approbation par membre, commandes en attente jusqu'à l'accord d'un approbateur (ni paiement, ni expédition, ni facture avant), e-mail d'accusé, expiration."
              en: 'Purchase approval for company accounts: order and approval limits per member, pending orders held until a company approver approves them (no payment, shipment or invoice before), acknowledgement e-mail, expiry.'
          demo_route: tmonier_purchase_approval_shop_approvals
          scenario:
              fr: "Passez une commande au-dessus de votre limite d'achat, puis connectez-vous en Paul (approbateur) : l'entrée « Approbations » de l'en-tête affiche le nombre de commandes qui l'attendent, et mène à la liste à décider. Isabelle (administratrice) a la même entrée : elle décide aussi, dans la limite de son propre plafond. Claire (acheteuse) ne l'a jamais."
              en: "Place an order above your spending limit, then sign in as Paul (approver): the \"Approvals\" entry of the header shows how many orders wait for him and leads to the list to decide. Isabelle (administrator) has the same entry: she decides too, within her own limit. Claire (buyer) never has it."
          advised_account: claire@acme.example
        - slug: sylius-quick-order-plugin
          name: 'Quick Order'
          category: purchasing
          description:
              fr: "Commande rapide B2B : collez des lignes SKU;quantité ou importez un CSV, prévisualisez, ajoutez des centaines de lignes au panier en une fois, recommandez d'anciennes commandes."
              en: 'B2B quick order: paste SKU;quantity lines or upload a CSV, preview, add up to hundreds of lines to the cart in one pass, reorder past orders.'
          demo_route: tmonier_quick_order_shop_index
          scenario:
              fr: "Collez des lignes « SKU;quantité » dans la commande rapide, vérifiez l'aperçu et ajoutez tout au panier en une fois."
              en: "Paste \"SKU;quantity\" lines into quick order, check the preview and add everything to the cart at once."
          advised_account: claire@acme.example
        - slug: sylius-quote-request-plugin
          name: 'Quote Request'
          category: purchasing
          description:
              fr: "Demande de devis B2B : depuis le panier ou une fiche produit, négociation en administration (prix, remise, validité), propositions par e-mail, acceptation vers un checkout classique aux prix négociés verrouillés."
              en: 'B2B request for quote: quote requests from the cart or a product page, admin negotiation (prices, discount, validity), proposals by e-mail, acceptance into a regular checkout with locked negotiated prices.'
          demo_route: tmonier_quote_request_shop_new
          scenario:
              fr: "Depuis votre panier, demandez un devis, puis acceptez la proposition négociée et commandez au prix verrouillé."
              en: "From your cart, request a quote, then accept the negotiated proposal and order at the locked price."
          advised_account: claire@acme.example
        - slug: sylius-registration-approval-plugin
          name: 'Registration Approval'
          category: admin
          description:
              fr: "Inscription validée par l'administrateur : un compte créé sur un canal B2B reste en attente, sans accès au catalogue fermé ni aux prix, jusqu'à son approbation ou son refus depuis l'admin, avec e-mails et sans énumération de comptes."
              en: 'Registration approval: an account registered on a B2B channel stays pending, without access to the closed catalogue or the prices, until an administrator approves or rejects it from the admin panel, with e-mails and no account enumeration.'
          demo_route: sylius_shop_register
          scenario:
              fr: "Inscrivez-vous sur le canal B2B : votre compte reste en attente (page d'attente, prix masqués). Connectez-vous ensuite en tant que Sophie, approuvez-le dans Clients > Inscriptions, puis retrouvez l'e-mail dans la boîte de démo."
              en: "Register on the B2B channel: your account stays pending (waiting page, prices hidden). Then sign in as Sophie, approve it in Customers > Registrations, and find the e-mail in the demo mailbox."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-tier-pricing-plugin
          name: 'Tier Pricing'
          category: catalog
          description:
              fr: "Tarification dégressive : paliers de prix par quantité, par canal, groupe de clients, produit ou variante, appliqués au panier et affichés sur les fiches produit, import/export CSV et API."
              en: 'Volume (tier) pricing: quantity price breaks per channel, customer group, product or variant, applied in the cart and shown on product pages, CSV import/export and API.'
          demo_route: null
          scenario:
              fr: "Sur une fiche produit, augmentez la quantité et voyez le prix dégressif s'appliquer, dans le tableau des paliers puis dans le panier."
              en: "On a product page, increase the quantity and watch the volume price apply, in the price break table then in the cart."
          advised_account: marc@techparts.example
        - slug: sylius-timeline-plugin
          name: 'Timeline'
          category: admin
          description:
              fr: "Chronologie des commandes et des clients avec notes internes du personnel dans l'administration."
              en: 'Order and customer timeline with internal staff notes in the admin panel.'
          demo_route: null
          scenario:
              fr: "Ouvrez une commande, épinglez une note interne pour l'équipe et retrouvez-la dans la chronologie."
              en: "Open an order, pin an internal note for the team and find it in the timeline."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-trade-credit-plugin
          name: 'Trade Credit'
          category: billing
          description:
              fr: "Paiement sur compte B2B : comptes de crédit avec plafonds, conditions net et fin de mois, réservations atomiques, relevés, encours en administration et conditions de paiement Factur-X."
              en: 'B2B trade credit (payment on account): credit accounts with limits, net terms and end-of-month terms, atomic reservations, statements, admin open items and Factur-X payment terms.'
          demo_route: null
          scenario:
              fr: "Choisissez le paiement sur compte au checkout et vérifiez l'encours de crédit de votre société sur votre relevé."
              en: "Choose payment on account at checkout and check your company's credit used on your statement."
          advised_account: claire@acme.example
        - slug: sylius-webhook-outbox-plugin
          name: 'Webhook Outbox'
          category: integration
          description:
              fr: "Outbox transactionnelle pour les webhooks sortants : capture atomique des événements, signatures Standard Webhooks, relances, files d'échec et rejeu depuis l'administration."
              en: 'Transactional outbox for outgoing webhooks: atomic event capture, Standard Webhooks signatures, retries, dead letters and replay from the admin panel.'
          demo_route: null
          scenario:
              fr: "Dans l'administration, consultez les webhooks sortants, relancez un envoi en échec et rejouez un événement."
              en: "In the admin, browse the outgoing webhooks, retry a failed delivery and replay an event."
          advised_account: sophie@fournitures-pro.example
        - slug: sylius-withdrawal-plugin
          name: 'Withdrawal'
          category: compliance
          description:
              fr: "Bouton de rétractation européen (directive (UE) 2023/2673, art. 11 bis de la directive droits des consommateurs). Visible sur le canal B2C."
              en: 'EU withdrawal button (Directive (EU) 2023/2673, Art. 11a Consumer Rights Directive). Visible on the B2C channel.'
          demo_route: tmonier_withdrawal_shop_form
          scenario:
              fr: "Sur le canal B2C, ouvrez une commande passée et utilisez le bouton de rétractation pour exercer votre droit de rétractation."
              en: "On the B2C channel, open a past order and use the withdrawal button to exercise your right of withdrawal."
          advised_account: lea@demo.example
